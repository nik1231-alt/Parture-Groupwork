<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 650" width="680" height="650" font-family="Helvetica, Arial, sans-serif"><title>Funnel Werbung für schwache Angebote</title><rect width="680" height="650" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="20" width="220" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="150" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">App erkennt schwache Angebote</text><text x="150" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Low impressions, geeignet</text><line x1="150" y1="68" x2="150" y2="94" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="400" y="20" width="240" height="48" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="520" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">Ausgeschlossen</text><text x="520" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">z. B. Auktion, in anderem Test</text><line x1="260" y1="44" x2="398" y2="44" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/><rect x="40" y="96" width="220" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="150" y="114" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">App stellt Test zusammen</text><text x="150" y="132" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Hälfte Werbung, Hälfte Kontrolle</text><line x1="150" y1="144" x2="150" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="400" y="96" width="240" height="48" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="520" y="114" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">Zu wenige geeignete</text><text x="520" y="132" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">unter 40: kein Vorschlag</text><line x1="260" y1="120" x2="398" y2="120" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/><rect x="40" y="172" width="220" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="150" y="190" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Admin gibt frei</text><text x="150" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">sieht Liste und Kosten</text><line x1="150" y1="220" x2="150" y2="246" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="400" y="172" width="240" height="48" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="520" y="190" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">Abgelehnt</text><text x="520" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">bei eBay passiert nichts</text><line x1="260" y1="196" x2="398" y2="196" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/><rect x="40" y="248" width="220" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="150" y="266" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Anzeigen schalten</text><text x="150" y="284" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">nach Vorabprüfung, 10 % Satz</text><line x1="150" y1="296" x2="150" y2="322" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="400" y="248" width="240" height="48" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="520" y="266" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">Zu viele fallen aus</text><text x="520" y="284" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">unter 10 pro Gruppe: Abbruch</text><line x1="260" y1="272" x2="398" y2="272" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/><rect x="40" y="324" width="220" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="150" y="342" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Läuft 7 Tage</text><text x="150" y="360" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">endet automatisch bei eBay</text><line x1="150" y1="372" x2="150" y2="398" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="400" y="324" width="240" height="48" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="520" y="342" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">Notbremse</text><text x="520" y="360" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Kostendeckel: Anzeigen stoppen</text><line x1="260" y1="348" x2="398" y2="348" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/><rect x="40" y="400" width="220" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="150" y="418" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Urteil nach Tag 10</text><text x="150" y="436" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">vorläufig, Test gegen Kontrolle</text><line x1="150" y1="448" x2="150" y2="502" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><path d="M260 424 L520 424 L520 502" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="504" width="220" height="48" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/><text x="150" y="522" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#27500A">Behalten</text><text x="150" y="540" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">besser und rechnet sich</text><rect x="400" y="504" width="240" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="520" y="522" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Verwerfen und zurückbauen</text><text x="520" y="540" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">kein Unterschied, schlechter, zu teuer</text><line x1="150" y1="552" x2="150" y2="586" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><path d="M520 552 L520 569 L150 569" fill="none" stroke="#5F5E5A" stroke-width="1.5"/><rect x="40" y="588" width="600" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="340" y="606" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Nachlauf bis Tag 37</text><text x="340" y="624" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Gebühren und Verkäufe mit eBay abgleichen, dann endgültig abschließen</text></svg>