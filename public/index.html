<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parture Produktmanagement</title>
<style>
  :root { --bg: #f8fafc; --karte: #fff; --text: #0f172a; --leise: #64748b; --linie: #e2e8f0; --akzent: #ea580c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f172a; --karte: #1e293b; --text: #e2e8f0; --leise: #94a3b8; --linie: #334155; } }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .leise { color: var(--leise); font-size: 14px; }
  .reihe { display: flex; gap: 12px; flex-wrap: wrap; margin: 18px 0; }
  .kachel { background: var(--karte); border: 1px solid var(--linie); border-radius: 12px; padding: 12px 16px; min-width: 140px; }
  .kachel b { font-size: 22px; display: block; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--linie); border-radius: 10px; background: var(--karte); color: var(--text); font-size: 15px; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; background: var(--karte); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--linie); font-size: 14px; }
  th { color: var(--leise); font-weight: 600; }
  td.z { text-align: right; font-variant-numeric: tabular-nums; }
  img { width: 36px; height: 36px; object-fit: cover; border-radius: 6px; vertical-align: middle; margin-right: 8px; }
</style>
</head>
<body>
<main>
  <h1>Parture Produktmanagement</h1>
  <div class="leise" id="stand">lade …</div>
  <div class="reihe" id="kanaele"></div>
  <input id="suche" placeholder="Produkt suchen (Titel oder Nummer)">
  <table>
    <thead><tr><th>Produkt</th><th>Status</th><th class="z">Preis Ø</th><th class="z">Stück 90 T</th><th class="z">Stück gesamt</th><th>Zuletzt verkauft</th></tr></thead>
    <tbody id="liste"></tbody>
  </table>
</main>
<script>
const $ = (s) => document.querySelector(s);
const eur = (v) => v == null ? "–" : Number(v).toLocaleString("de-DE", { style: "currency", currency: "EUR" });
const datum = (s) => s ? new Date(s).toLocaleDateString("de-DE") : "–";
async function api(p) { const r = await fetch(p); const j = await r.json(); if (!j.ok) throw new Error(j.error); return j.daten; }
async function stand() {
  try {
    const s = await api("/api/stand");
    $("#stand").textContent = `Stand ${new Date(s.exportiert_at).toLocaleString("de-DE")} · ${s.produkte} Produkte · ${s.kanaele} Kanal-Einträge · ${s.bilder} Bilder`;
    const k = await api("/api/kanaele");
    $("#kanaele").innerHTML = k.map((x) => `<div class="kachel"><span class="leise">${x.channel}</span><b>${x.produkte}</b><span class="leise">${x.gelistet} gelistet · ${x.stueck_90d ?? 0} Stück / 90 T</span></div>`).join("");
  } catch (e) { $("#stand").textContent = e.message; }
}
async function liste(q) {
  const p = await api("/api/produkte" + (q ? "?q=" + encodeURIComponent(q) : ""));
  $("#liste").innerHTML = p.map((x) => `<tr><td>${x.image_url ? `<img src="${x.image_url}" alt="">` : ""}<span class="leise">${x.number}</span> ${x.title}</td><td>${x.status ?? ""}</td><td class="z">${eur(x.avg_price)}</td><td class="z">${x.units_90d ?? 0}</td><td class="z">${x.units_total ?? 0}</td><td>${datum(x.last_sold_at)}</td></tr>`).join("");
}
let t; $("#suche").addEventListener("input", (e) => { clearTimeout(t); t = setTimeout(() => liste(e.target.value.trim()), 200); });
stand(); liste("");
</script>
</body>
</html>
