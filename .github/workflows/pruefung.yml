name: Checks

# Runs on every pull request and on every push to main and vorschau (the preview branch). No secrets: the tests need neither eBay keys nor network.
on:
  pull_request:
  push:
    branches: [main, vorschau]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history is scanned for secrets
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Secret scan (files and history)
        run: node scripts/geheimnis-scan.mjs --historie
      - name: Tests
        run: npm test
